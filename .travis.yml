language: node_js
os: linux
dist: focal
node_js:
  - 22
before_script:
  - npm install @11ty/eleventy -g
script: eleventy --pathprefix="/"
deploy:
  provider: pages
  strategy: git
  fqdn: coreydmccarty.dev
  local_dir: _site
  target_branch: master
  cleanup: false
  token: $GITHUB_TOKEN  # Set in travis-ci.org dashboard, marked secure
  keep_history: true
  on:
    branch: development
